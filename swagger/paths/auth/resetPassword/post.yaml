tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: 'Reset the password for the user with the provided token and new password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: 'Reset token'
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
          password:
            description: 'New password'
            type: string
            example: '987654321'
responses:
  '200':
    description: 'Password has been successfully reset'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset'
            data:
              type: object
              additionalProperties: false
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
