tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: 'Logout the user and clear session cookies'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: 'Email of the user'
            type: string
            example: 'john.doe@example.com'
          password:
            description: 'Password for the user account'
            type: string
            example: '1234567890'
responses:
  '204':
    description: 'Successfully logged out a user'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
