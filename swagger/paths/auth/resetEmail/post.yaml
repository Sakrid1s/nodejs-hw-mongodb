tags:
  - Auth
summary: Request reset email
operationId: requestResetEmail
description: 'Request reset email for user'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: 'Email of the user'
            type: string
            example: 'john.doe@example.com'
responses:
  '200':
    description: 'Reset password email successfully sent'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email successfully sent'
            data:
              type: object
              additionalProperties: false
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
