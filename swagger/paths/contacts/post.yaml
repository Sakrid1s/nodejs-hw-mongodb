tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            description: 'Contact name'
            type: string
            example: 'Yulia Shevchenko'
          phoneNumber:
            description: 'Contact phone number'
            type: string
            example: '+380000000001'
          email:
            description: 'Contact email'
            type: string
            example: 'example@example.com'
          isFavourite:
            description: 'Is favorite contact'
            type: boolean
            default: false
            example: false
          contactType:
            description: 'Contact type'
            type: string
            enum: ['work', 'home', 'personal']
            default: 'personal'
            example: 'personal'
          photo:
            description: 'Link to photo'
            type: string
            format: binary
responses:
  '201':
    description: 'Successfully create a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contacts.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
