tags:
  - Contacts
summary: Patch contact by ID
operationId: patchContacts
description: 'Patch contact by ID'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      example: '665f5b9b26f55579f03a428b'
    description: 'ID of contact'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: 'Contact name'
            type: string
            example: 'Yulia Shevchenko'
          phoneNumber:
            description: 'Contact phone number'
            type: string
            example: '+380000000001'
          email:
            description: 'Contact email'
            type: string
            example: 'example@example.com'
          isFavourite:
            description: 'Is favorite contact'
            type: boolean
            default: false
            example: false
          contactType:
            description: 'Contact type'
            type: string
            enum: ['work', 'home', 'personal']
            default: 'personal'
            example: 'personal'
          photo:
            description: 'Link to photo'
            type: string
            format: binary
responses:
  '200':
    description: 'Successfully patch contact by ID'
    content:
      aplication/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patch a contact with id 665f5b9b26f55579f03a428b'
            data:
              type: object
              $ref: ../../../components/schemas/contacts.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: '../../../components/responses/404.yaml'
