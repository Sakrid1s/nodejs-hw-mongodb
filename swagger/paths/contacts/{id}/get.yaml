tags:
  - Contacts
summary: Get contacts by ID
operations: getContacts
description: 'Get contact by ID'
security:
  - bearerAuth: []
parameters:
  - in: path
  name: id
  required: true
  scheme:
    type: string
    example: '665f5b9b26f55579f03a428b'
responses:
  '200':
    description: 'get contacts by ID'
    content:
      aplication/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found a contact with id 665f5b9b26f55579f03a428b'
            data:
              type: object
              $$ref: ../../../contacts/schemas/contacts.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
