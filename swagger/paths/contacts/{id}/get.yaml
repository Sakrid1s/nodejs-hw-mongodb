tags:
  - Contacts
summary: Get contacts by ID
operationId: getContacts
description: 'Get contact by ID'
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      example: '665f5b9b26f55579f03a428b'
    description: 'ID of contact'
responses:
  '200':
    description: 'get contacts by ID'
    content:
      aplication/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found a contact with id 665f5b9b26f55579f03a428b'
            data:
              type: object
              $ref: ..\..\..\components\schemas\contacts.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
